version: "3.9"

services:
  backend:
    build: .
    container_name: rag-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: python run.py

  frontend:
    build: .
    container_name: rag-frontend
    ports:
      - "8501:8501"
    command: streamlit run frontend/app.py